[project]
name = "pyvaonis"
version = "0.1.0"
description = "Async client + CLI for Vaonis smart telescopes (local Wi-Fi API)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Douwe Maan", email = "hi@douwe.me" }]
keywords = ["vaonis", "stellina", "telescope", "astronomy", "home-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.9",
    "pynacl>=1.5",
    "pydantic>=2.10",
]

[project.urls]
Homepage = "https://github.com/DouweM/pyvaonis"
Repository = "https://github.com/DouweM/pyvaonis"
Issues = "https://github.com/DouweM/pyvaonis/issues"

[project.optional-dependencies]
cli = ["typer>=0.15", "rich>=13.9"]
astro = ["ephem>=4.1"]  # planet/Moon/Sun ephemerides (solar-system targets)

[project.scripts]
vaonis = "pyvaonis.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The library lives inside the HA integration (so HACS ships it from the repo, no PyPI release needed);
# hatch still builds/installs it as the top-level importable `pyvaonis` package.
packages = ["custom_components/vaonis/pyvaonis"]

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.14",
    "typer>=0.15",
    "ephem>=4.1",
    # So pyright can resolve `homeassistant` and type-check the whole integration (not just the lib).
    "homeassistant>=2024.12",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]  # B008: typer.Option(...) defaults are the Typer idiom

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["pyvaonis"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
include = ["custom_components/vaonis", "tests"]
# Home Assistant exposes these via component packages that don't list __all__ (e.g.
# `HomeAssistantView`, `MediaClass`) — the documented import paths trip this check, so silence it.
reportPrivateImportUsage = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
