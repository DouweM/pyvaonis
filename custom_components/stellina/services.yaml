export_capture:
  name: Export capture
  description: >-
    Render a full-resolution image of a capture and save it under the Home Assistant media
    directory (browsable under Media). Defaults to the capture currently being observed.
  fields:
    capture_id:
      name: Capture ID
      description: The capture to export. Omit to use the current observation's capture.
      required: false
      example: "abc123"
      selector:
        text:
    format:
      name: Format
      description: Export format.
      required: false
      default: tiff
      selector:
        select:
          options:
            - tiff
            - jxl

run_plan:
  name: Run observing plan
  description: >-
    Run an unattended plan in the background: observe each target for its minutes, then park
    (and optionally shut down). Waits for darkness if asked. Gate on weather in the automation
    that calls this (e.g. condition on weather.microclimate), not here.
  fields:
    targets:
      name: Targets
      description: List of "name:minutes" (minutes optional, default 20), e.g. "M42:30".
      required: true
      example: ["M42:30", "Andromeda Galaxy:45", "Jupiter:10"]
      selector:
        object:
    wait_for_dark:
      name: Wait for dark
      description: Wait until the Sun is below -10° before starting.
      default: true
      selector:
        boolean:
    require_dark:
      name: Require dark
      description: Stop the plan once the Sun rises above -10°.
      default: true
      selector:
        boolean:
    park:
      name: Park at end
      default: true
      selector:
        boolean:
    shutdown:
      name: Shut down at end
      default: false
      selector:
        boolean:

stop_plan:
  name: Stop observing plan
  description: Cancel a running plan and stop the current observation.

observe:
  name: Observe object
  description: Take control and slew to a catalog object, then start imaging.
  fields:
    target:
      name: Target
      description: Catalog id, designation, or name (e.g. M42, "Orion Nebula", Jupiter).
      required: true
      example: "M42"
      selector:
        text:
    allow_solar:
      name: Allow solar
      description: Permit Sun/near-Sun targets (only with the Vaonis solar filter installed).
      default: false
      selector:
        boolean:
