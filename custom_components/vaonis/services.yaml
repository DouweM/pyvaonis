export_capture:
  name: Export capture
  description: >-
    Render a full-resolution image of a capture and save it under the Home Assistant media
    directory (browsable under Media). Defaults to the capture currently being observed.
  fields:
    capture_id:
      name: Capture ID
      description: The capture to export. Omit to use the current observation's capture.
      required: false
      example: "abc123"
      selector:
        text:
    format:
      name: Format
      description: Export format.
      required: false
      default: tiff
      selector:
        select:
          options:
            - tiff
            - jxl

run_plan:
  name: Run observing plan
  description: >-
    Start the telescope's native Plan-My-Night: it auto-initialises and observes each target for
    its minutes, advancing on schedule by itself (it keeps running even if Home Assistant
    disconnects), then parks. There is no power-off step. Gate on weather in the automation that
    calls this (e.g. condition on weather.microclimate), not here.
  fields:
    targets:
      name: Targets
      description: List of "name:minutes" (minutes optional, default 20), e.g. "M42:30".
      required: true
      example: ["M42:30", "Andromeda Galaxy:45", "Jupiter:10"]
      selector:
        object:
    wait_for_dark:
      name: Wait for dark
      description: Schedule the plan to start at the next dusk (Sun below -10°) instead of now.
      default: true
      selector:
        boolean:

stop_plan:
  name: Stop observing plan
  description: Cancel the running native plan (planner/stopPlan).

observe:
  name: Observe object
  description: Take control and slew to a catalog object, then start imaging.
  fields:
    target:
      name: Target
      description: Catalog id, designation, or name (e.g. M42, "Orion Nebula", Jupiter).
      required: true
      example: "M42"
      selector:
        text:
    allow_solar:
      name: Allow solar
      description: Permit Sun/near-Sun targets (only with the Vaonis solar filter installed).
      default: false
      selector:
        boolean:

autoinit:
  name: Initialise / align
  description: >-
    Take control and run auto-init (plate-solve + autofocus) at a location. Defaults to Home
    Assistant's configured latitude/longitude. Telescope must be idle.
  fields:
    latitude:
      name: Latitude
      description: Defaults to Home Assistant's location.
      selector:
        number: { min: -90, max: 90, step: 0.0001, mode: box }
    longitude:
      name: Longitude
      description: Defaults to Home Assistant's location.
      selector:
        number: { min: -180, max: 180, step: 0.0001, mode: box }
    skip_autofocus:
      name: Skip autofocus
      default: false
      selector:
        boolean:

adjust_framing:
  name: Change framing
  description: >-
    Nudge the live framing while observing (the app's "Change Framing"). Safe during an
    observation.
  fields:
    x:
      name: X offset
      default: 0
      selector:
        number: { min: -1000, max: 1000, mode: box }
    y:
      name: Y offset
      default: 0
      selector:
        number: { min: -1000, max: 1000, mode: box }
    rot:
      name: Rotation (degrees)
      default: 0
      selector:
        number: { min: -180, max: 180, step: 0.1, mode: box }

set_camera_params:
  name: Set camera parameters
  description: Live-tune gain / exposure / saturation during an observation (only set fields change).
  fields:
    gain:
      name: Gain
      selector:
        number: { min: 0, max: 1000, mode: box }
    exposure_seconds:
      name: Exposure (seconds)
      selector:
        number: { min: 0.1, max: 60, step: 0.1, mode: box }
    saturation:
      name: Saturation
      selector:
        number: { min: 0, max: 5, step: 0.1, mode: box }
